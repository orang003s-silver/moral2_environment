<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ==========================================

// ==========================================

const h = (t, ...c) => ({ s: 'hero', t, c });
const b = (t, ...c) => ({ s: 'bear', t, c });

const BATTLES = [
  // ---------- STAGE 1 : 북극 마을 ----------

    qs: [
      h("쫑쫑아, 진정해! 왜 북극 마을까지 내려와서 우리를 위협하는 거야?",

        "달이 지구에 더 가까워져서"),
    ],
  },
  {
    stage: 1, label: '1-2', name: '분노한 쫑쫑이', icon: '😡🐻‍❄️',

    qs: [
      h("빙하가 계속 녹으면 바다에는 어떤 일이 벌어질까?",
        "해수면이 올라 해안 마을과 섬이 위험해진다",
        "바다가 더 맑아져서 모두에게 좋아진다",
        "물이 늘어나니 물고기가 걱정 없이 늘어난다"),
      h("쫑쫑이가 쓰레기통을 뒤엎었어. 우리가 먼저 바꿔야 할 일상은?",
        "일회용품을 줄이고 분리배출을 철저히 하자",
        "쓰레기는 한곳에 모아서 태워버리자",

    ],
  },
  {
    stage: 1, label: '1-3', name: '폭주한 쫑쫑이', icon: '😡🐻‍❄️',
    intro: '쫑쫑이의 눈이 붉게 번뜩인다! 마지막 설득이 필요하다. 진심을 전하자!',
    qs: [
      h("네 터전인 해빙이 녹는 것을 막으려면 우리가 어떻게 해야 할까?",
        "온실가스 배출을 줄이기 위해 에너지 절약과 대중교통 이용을 실천할게.",
        "에어컨을 지금보다 더 세게 틀어서 지구 전체를 시원하게 만들면 돼!",
        "공장에서 거대한 얼음을 만들어서 북극 바다에 계속 던져 넣을게."),
      h("분노가 조금씩 가라앉고 있어. 이번엔 쫑쫑이의 마음에 닿아야 해!",
        "너의 두려움을 이해해. 우리가 함께 변화를 만들어 볼게.",
        "화낸다고 달라지는 건 없으니 일단 조용히 해!",
        "그건 네 사정이고, 우린 우리 사정이 있어."),
      h("마지막으로 진심을 전하자!",
        "우리가 환경 보호와 '탄소 중립'을 꼭 실천해서 네 집을 되찾아줄게! 나를 믿어!",
        "이제 자연을 포기하고 안락한 동물원으로 가서 편하게 사는 게 어때?",
        "어쩔 수 없는 자연의 섭리야. 변화된 환경에 맞춰서 진화해보렴."),
    ],
  },
  // ---------- STAGE 2 : 공장 지대 ----------
  {
    stage: 2, label: '2-1', name: '매연 공장 직원', icon: '🏭👷',
    intro: '공장 지대에 도착했다! 굴뚝에서 시커먼 연기가 쏟아지고, 직원이 앞을 막아선다!',
    qs: [
      h("공장의 매연이 대기를 오염시키고 온난화를 부추기고 있어요!",
        "친환경 공정으로 바꾸면 일자리와 환경을 함께 지킬 수 있어요.",
        "그럼 공장 문을 영원히 닫아버리세요!",
        "일자리가 중요하니 환경은 포기하죠."),
      b("크르릉…! (저 연기 때문에 숨쉬기가 힘들어…!)",
        "대기오염은 동물뿐 아니라 사람의 호흡기 건강도 해친다는 뜻이구나!",
        "연기는 따뜻하니까 겨울엔 오히려 좋다는 말이구나.",
        "그냥 투정을 부리는 소리구나."),
    ],
  },
  {
    stage: 2, label: '2-2', name: '폐수 업자', icon: '🚰🧪',
    intro: '강가에서 폐수를 몰래 버리던 업자가 나타났다! 물이 보랏빛으로 변하고 있다!',
    qs: [
      h("정화하지 않은 폐수를 강에 버리면 안 됩니다!",
        "정화 시설을 갖추고 법정 배출 기준을 지켜야 합니다.",
        "밤에 몰래 버리면 아무도 모르잖아요.",
        "더 먼 바다까지 나가서 버리면 됩니다."),
      b("크와앙! (바다가 오염되어 먹이가 사라지고 있어!)",
        "오염물질이 먹이사슬을 따라 쌓여 결국 인간에게도 돌아온다는 뜻이구나!",
        "물고기가 많아져서 먹이가 늘어난다는 뜻이구나.",
        "바다는 넓어서 아무 영향이 없다는 뜻이구나."),
      h("쓰레기와 플라스틱 문제의 근본적인 해법은 뭘까요?",
        "줄이고(Reduce), 다시 쓰고(Reuse), 재활용(Recycle)하는 순환 경제로 가야 합니다.",
        "한 번 쓰고 매립지에 계속 묻으면 됩니다.",
        "바다에 던지면 자연 분해되니 괜찮습니다."),
    ],
  },
  {
    stage: 2, label: '2-3', name: '환경 파괴 인간 무리', icon: '🏭🦹‍♂️',
    intro: '공장장 무리가 모습을 드러냈다! 이들만 설득하면 지구를 구할 수 있다!',
    qs: [
      h("이봐요! 당신들 공장에서 내뿜는 매연과 폐수가 북극의 빙하를 녹이고 있어요!",
        "이제 기업의 'ESG 경영'은 선택이 아닌 필수입니다. 친환경 공정으로 전환하세요!",
        "당신들 모두 감옥에 가야 합니다! 이 공장을 당장 터뜨려버리겠어!",
        "공장을 계속 돌릴 거면, 북극곰들에게 방독면을 하나씩 사주세요!"),
      b("크와아앙!! (서식지를 잃고 생태계가 파괴되면, 결국 너희 인간들도 무사하지 못할 거다!)",
        "생물 다양성이 파괴되면 먹이사슬 최상단인 인간의 생존도 위협받게 된다는 뜻이구나!",
        "우리 집은 콘크리트로 튼튼하게 지어져서 기후 변화에도 끄떡없거든요?",
        "동물들이 멸종하면 우리가 먹을 고기가 줄어든다는 단순한 불평이구나."),
      h("무분별한 화석 연료 사용을 멈춰야 합니다. 온실가스를 줄일 확실한 대안이 있습니다!",
        "태양광, 풍력 등 '신재생 에너지'로 전환하여 탄소 배출을 0으로 만들어야 합니다!",
        "당장 모든 전기를 끊고 원시 시대로 돌아가 촛불을 켜고 삽시다.",
        "오염된 지구를 버리고 우주선을 타고 새로운 행성을 찾아 떠나면 됩니다."),
      b("크르르릉...! (더 이상 무분별한 개발을 멈추고 파괴된 자연을 복원하라고 약속해라!)",
        "무분별한 개발을 멈추고 자연을 복원하지 않으면, 내가 직접 당신들을 응징하겠다!",
        "그냥 이 근처에 북극곰 전용 수영장을 하나 지어주면 용서해주겠다!",
        "돈을 많이 벌어서 북극에 거대한 냉동고를 지어주면 해결될 일이다!"),
    ],
  },
];

const WRONG_DMG = 12;
const HEAL_BETWEEN = 20;
const HINTS_PER_STAGE = 2;
const shuffle = (a) => [...a].sort(() => Math.random() - 0.5);
const wait = (fn, ms) => setTimeout(fn, ms);

function App() {
  const [phase, setPhase] = useState('START'); // START INTRO BATTLE BATTLE_CLEAR STAGE_CLEAR ENDING_DOC ENDING_FINAL GAME_OVER
  const [bi, setBi] = useState(0);
  const [qi, setQi] = useState(0);
  const [php, setPhp] = useState(100);
  const [ehp, setEhp] = useState(100);
  const [combo, setCombo] = useState(0);
  const [hints, setHints] = useState(HINTS_PER_STAGE);
  const [opts, setOpts] = useState([]);
  const [off, setOff] = useState([]); // 힌트로 지워졌거나 이미 틀린 선택지
  const [text, setText] = useState('');
  const [who, setWho] = useState('');
  const [shown, setShown] = useState(0);
  const [busy, setBusy] = useState(true);
  const [eHit, setEHit] = useState(false);
  const [pHit, setPHit] = useState(false);

  const battle = BATTLES[bi];
  const q = battle.qs[qi];
  const inBattle = ['INTRO', 'BATTLE', 'BATTLE_CLEAR', 'STAGE_CLEAR'].includes(phase);
  const hasBear = battle.stage === 2 || phase === 'STAGE_CLEAR';
  const typing = shown < text.length;
  const hpColor = (v) => (v > 50 ? 'bg-green-500' : v > 20 ? 'bg-yellow-400' : 'bg-red-500');

  // 타자기 효과
  useEffect(() => {
    setShown(0);
    const id = setInterval(() => setShown(n => (n >= text.length ? n : n + 1)), 22);
    return () => clearInterval(id);
  }, [text]);

  const say = (msg, speaker = '') => { setText(msg); setWho(speaker); };

  const loadQ = (i, k) => {
    const qq = BATTLES[i].qs[k];
    setOpts(shuffle(qq.c.map((t, n) => ({ text: t, ok: n === 0 }))));
    setOff([]);
    say(qq.t, qq.s === 'bear' ? '쫑쫑이' : '나');
    setBusy(false);
  };

  const enterBattle = (i) => {
    setBi(i); setQi(0); setEhp(100); setCombo(0);
    if (i === 0 || BATTLES[i].stage !== BATTLES[i - 1].stage) setHints(HINTS_PER_STAGE);
    setPhase('INTRO'); setBusy(true);
    say(BATTLES[i].intro);
  };

  const startGame = () => { setPhp(100); enterBattle(0); };

  const beginQuestions = () => { setPhase('BATTLE'); loadQ(bi, 0); };

  const pick = (idx) => {
    if (busy || typing || off.includes(idx)) return;
    setBusy(true);
    const n = battle.qs.length;

    if (opts[idx].ok) {
      const c = combo + 1;
      setCombo(c); setEHit(true);
      setEhp(Math.max(0, ehp - Math.ceil(100 / n)));
      if (c >= 2) setPhp(p => Math.min(100, p + 5));
      say(c >= 2 ? `급소에 맞았다! ${c}연속 설득 성공! (멘탈 +5)` : '효과는 굉장했다! 상대가 흔들리고 있다!');
      wait(() => {
        setEHit(false);
        if (qi === n - 1) {
          setEhp(0);
          if (bi === BATTLES.length - 1) setPhase('ENDING_DOC');
          else {
            const stageEnds = BATTLES[bi + 1].stage !== battle.stage;
            setPhase(stageEnds ? 'STAGE_CLEAR' : 'BATTLE_CLEAR');
            say(stageEnds ? '쫑쫑이가 마음을 열었다! "…너 내 동료가 돼라."' : `${battle.name}의 마음이 움직였다! 설득 성공!`);
          }
        } else { setQi(qi + 1); loadQ(bi, qi + 1); }
      }, 2200);
    } else {
      setCombo(0); setPHit(true);
      const hp = Math.max(0, php - WRONG_DMG);
      setPhp(hp); setOff(o => [...o, idx]);
      say(`효과가 별로인 듯하다… 논리의 허점을 찔려 멘탈이 ${WRONG_DMG} 깎였다!`);
      wait(() => {
        setPHit(false);
        if (hp === 0) setPhase('GAME_OVER');
        else { say(q.t, q.s === 'bear' ? '쫑쫑이' : '나'); setBusy(false); }
      }, 2200);
    }
  };

  const useHint = () => {
    if (hints <= 0 || busy || typing) return;
    const wrong = opts.map((o, i) => (!o.ok && !off.includes(i) ? i : -1)).filter(i => i >= 0);
    if (wrong.length <= 1) return;
    setOff([...off, wrong[0]]); setHints(hints - 1);
  };

  const nextBattle = () => { setPhp(p => Math.min(100, p + HEAL_BETWEEN)); enterBattle(bi + 1); };

  const styles = `
    @keyframes shake { 0%{transform:translate(2px,2px) rotate(0)} 20%{transform:translate(-3px,-5px) rotate(-3deg)} 40%{transform:translate(-5px,0) rotate(3deg)} 60%{transform:translate(5px,5px) rotate(0)} 80%{transform:translate(-3px,-3px) rotate(3deg)} 100%{transform:translate(3px,-5px) rotate(-3deg)} }
    .shake-anim { animation: shake 0.5s; }
    @keyframes pop { 0%{transform:scale(0) translateY(20px);opacity:0} 50%{transform:scale(1.5) translateY(-20px);opacity:1} 100%{transform:scale(1.2) translateY(-10px);opacity:1} }
    .exclamation-anim { animation: pop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .bounce-slow { animation: bob 3s ease-in-out infinite; }
    @keyframes enter { from{transform:translateX(120px);opacity:0} to{transform:none;opacity:1} }
    .enter-anim { animation: enter 0.8s ease-out; }
    @keyframes blink { 50%{opacity:0} }
    .blink { animation: blink 1s steps(1) infinite; }
    .bg-s1 { background: linear-gradient(to bottom,#FFDAB9 0%,#FFE4B5 40%,#F0F8FF 40%,#FFFFFF 100%); }
    .bg-s2 { background: linear-gradient(to bottom,#8d99a3 0%,#b0bcc4 45%,#6f7a80 45%,#4a5358 100%); }
    .dialogue-text { font-size: 1.4rem; }
    @media (min-width: 768px) { .dialogue-text { font-size: 1.9rem; } }
    @media (prefers-reduced-motion: reduce) { .bounce-slow,.enter-anim,.shake-anim { animation: none; } }
  `;

  const HpBox = ({ name, hp, tone, tag }) => (
    <div className="bg-white/95 backdrop-blur-sm border-2 border-gray-800 rounded-lg p-2 sm:p-4 shadow-lg w-52 sm:w-72">
      <div className="flex justify-between items-center mb-1">
        <span className={`font-extrabold text-base sm:text-xl ${tone}`}>{name}</span>
        <span className="font-bold text-sm sm:text-base text-gray-500">{tag}</span>
      </div>
      <div className="flex items-center gap-2">
        <span className="font-black text-xs sm:text-sm text-amber-600">HP</span>
        <div className="flex-1 bg-gray-300 h-4 sm:h-5 rounded-full overflow-hidden border border-gray-500">
          <div className={`${hpColor(hp)} h-full transition-all duration-700 ease-out`} style={{ width: `${hp}%` }} />
        </div>
        <span className="font-bold text-xs sm:text-sm text-gray-600 w-9 text-right">{hp}%</span>
      </div>
    </div>
  );

  const btn = 'w-full mt-2 text-white font-black py-5 sm:py-6 rounded-xl text-xl sm:text-3xl shadow-xl transition active:scale-[0.98] border-4';

  return (
    <div className="w-full h-screen bg-gray-900 flex justify-center items-center select-none font-sans overflow-hidden">
      <style>{styles}</style>
      <div className="w-full max-w-5xl h-full sm:h-[95vh] bg-white relative overflow-hidden flex flex-col sm:rounded-2xl shadow-2xl">

        {phase === 'START' && (
          <div className="absolute inset-0 bg-blue-50 flex flex-col items-center justify-center p-6 text-center z-50 overflow-y-auto">
            <div className="flex gap-4 mb-8 bounce-slow items-center text-7xl sm:text-8xl">🌍 😡🐻‍❄️</div>
            <h1 className="text-4xl sm:text-6xl font-black text-blue-900 mb-6 tracking-tight">북극곰 쫑쫑이 구하기</h1>
            <p className="text-lg sm:text-2xl text-gray-800 mb-4 font-bold bg-white/80 px-8 py-3 rounded-full shadow-sm">
              환경을 파괴하는 자들을 설득하고 지구를 구하자!
            </p>
            <p className="text-base sm:text-lg text-gray-600 mb-10 font-medium">
              2개 스테이지 · 6번의 배틀 · 팩트카드 {HINTS_PER_STAGE}장으로 위기를 넘기세요
            </p>
            <button onClick={startGame} className="bg-blue-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-xl hover:bg-blue-700 transition transform hover:scale-105 active:scale-95">
              게임 시작
            </button>
          </div>
        )}

        {phase === 'GAME_OVER' && (
          <div className="absolute inset-0 bg-red-900 flex flex-col items-center justify-center p-6 text-center z-50 overflow-y-auto">
            <div className="text-8xl mb-6 text-white opacity-50">☠️</div>
            <h1 className="text-5xl font-extrabold text-white mb-4">설득 실패...</h1>
            <p className="text-2xl text-red-200 mb-3 font-medium">나의 멘탈이 부서져 더 이상 대화할 수 없습니다.</p>
            <p className="text-lg text-red-300 mb-10">{battle.label} 배틀 · {battle.name}에게 패배</p>
            <button onClick={() => setPhase('START')} className="bg-white text-red-900 font-bold py-4 px-10 rounded-full text-2xl shadow-lg hover:bg-gray-200 transition transform hover:scale-105">
              다시 시도하기
            </button>
          </div>
        )}

        {inBattle && (
          <div className="flex-1 relative flex flex-col w-full h-full">
            {/* 배틀 씬 */}
            <div className={`flex-1 relative w-full h-1/2 sm:h-[55%] overflow-hidden ${battle.stage === 1 ? 'bg-s1' : 'bg-s2'}`}>
              <div className="absolute top-[35%] left-0 w-full flex justify-around text-4xl sm:text-6xl opacity-80 pointer-events-none">
                {battle.stage === 1
                  ? <><span>🌲</span><span>🛖</span><span>🌲</span><span>⛄</span><span>🛖</span><span>🌲</span></>
                  : <><span>🏭</span><span>🏗️</span><span>🏭</span><span>🛢️</span><span>🏭</span><span>🏗️</span></>}
              </div>
              <div className="absolute top-3 left-3 sm:top-5 sm:left-6 bg-gray-900/80 text-white font-bold text-sm sm:text-lg px-3 py-1 rounded-lg z-10">
                {battle.stage === 1 ? '북극 마을' : '공장 지대'} · {battle.label} 배틀
              </div>
              <div className="absolute top-3 right-3 sm:top-5 sm:right-6 flex gap-1 z-10">
                {BATTLES.filter(x => x.stage === battle.stage).map(x => (
                  <span key={x.label} className={`w-4 h-4 sm:w-5 sm:h-5 rounded-full border-2 border-gray-800 ${BATTLES.indexOf(x) < bi ? 'bg-green-500' : x.label === battle.label ? 'bg-yellow-400' : 'bg-white'}`} />
                ))}
              </div>
              <div className="absolute inset-0 bg-black/5 pointer-events-none" />

              {/* 적 */}
              <div className="absolute top-14 sm:top-20 right-4 sm:right-12 flex flex-col items-end z-10">
                <div className="mb-2 sm:mb-4"><HpBox name={battle.name} hp={ehp} tone="text-red-700" tag={`배틀 ${battle.label}`} /></div>
                <div key={bi} className={`relative text-7xl sm:text-9xl drop-shadow-2xl enter-anim ${eHit ? 'shake-anim' : 'bounce-slow'}`}>
                  {battle.icon}
                  {eHit && <div className="absolute -top-12 -left-8 text-7xl sm:text-9xl exclamation-anim z-20">❗️</div>}
                </div>
              </div>

              {/* 플레이어 */}
              <div className="absolute bottom-4 sm:bottom-8 left-4 sm:left-12 flex flex-col items-start z-10">
                <div className={`relative mb-2 sm:mb-4 drop-shadow-2xl text-7xl sm:text-9xl ${pHit ? 'shake-anim' : ''}`}>
                  {q.s === 'bear' && phase === 'BATTLE' ? '😊🐻‍❄️' : '🧑'}
                  {pHit && <div className="absolute -top-12 -right-8 text-7xl sm:text-9xl exclamation-anim z-20">❗️</div>}
                </div>
                <HpBox name="나의 멘탈" hp={php} tone="text-blue-900" tag={combo >= 2 ? `🔥 ${combo}연속` : undefined} />
              </div>
            </div>

            {/* 대화 / 커맨드 */}
            <div className="h-1/2 sm:h-[45%] min-h-[300px] bg-white flex flex-col shadow-[0_-10px_20px_rgba(0,0,0,0.15)] z-20 rounded-t-3xl border-t-8 border-gray-800">
              <div className="bg-gray-100 px-4 sm:px-6 py-3 flex gap-2 sm:gap-3 items-center border-b border-gray-300 overflow-x-auto">
                <span className="font-bold text-gray-600 mr-1 whitespace-nowrap text-base sm:text-lg">파티:</span>
                <div className={`px-4 py-2 rounded-full border-2 text-base sm:text-lg font-bold whitespace-nowrap ${q.s === 'hero' && phase === 'BATTLE' ? 'border-blue-500 bg-blue-100 text-blue-900' : 'border-gray-400 bg-white text-gray-500'}`}>🧑 나</div>
                {hasBear && (
                  <div className={`px-4 py-2 rounded-full border-2 text-base sm:text-lg font-bold whitespace-nowrap ${q.s === 'bear' && phase === 'BATTLE' ? 'border-blue-500 bg-blue-100 text-blue-900' : 'border-gray-400 bg-white text-gray-500'}`}>😊🐻‍❄️ 쫑쫑이</div>
                )}
                <div className="flex-1" />
                {phase === 'BATTLE' && (
                  <button onClick={useHint} disabled={hints <= 0 || busy || typing}
                    className="px-4 py-2 rounded-full border-2 border-amber-500 bg-amber-100 text-amber-900 font-bold text-base sm:text-lg whitespace-nowrap disabled:opacity-40 hover:bg-amber-200 transition">
                    💡 팩트카드 ×{hints}
                  </button>
                )}
              </div>

              <div className="flex-1 p-4 sm:p-6 flex flex-col gap-3 sm:gap-4 overflow-y-auto bg-gray-50">
                <div className="bg-white border-4 border-gray-700 rounded-xl p-5 sm:p-7 shadow-sm min-h-[110px] sm:min-h-[140px] flex items-center">
                  <p className="text-gray-900 font-extrabold dialogue-text leading-tight sm:leading-relaxed break-keep">
                    {who && <span className="text-blue-600 mr-3">[{who}]</span>}
                    {text.slice(0, shown)}
                    {!typing && <span className="blink text-gray-500 ml-1">▼</span>}
                  </p>
                </div>

                {phase === 'BATTLE' && !busy && !typing && (
                  <div className="grid grid-cols-1 gap-2 sm:gap-3">
                    {opts.map((o, i) => (
                      <button key={o.text} onClick={() => pick(i)} disabled={off.includes(i)}
                        className="text-left text-lg sm:text-2xl font-bold text-gray-800 bg-white p-4 sm:p-5 rounded-xl border-4 border-gray-300 hover:border-blue-500 hover:bg-blue-50 transition-all active:scale-[0.98] break-keep disabled:opacity-30 disabled:line-through disabled:hover:border-gray-300 disabled:hover:bg-white">
                        <span className="inline-block w-8 sm:w-10 text-blue-500">{i + 1}.</span>{o.text}
                      </button>
                    ))}
                  </div>
                )}

                {phase === 'INTRO' && !typing && (
                  <button onClick={beginQuestions} className={`${btn} bg-red-600 border-red-900 hover:bg-red-700`}>⚔️ 설득 시작!</button>
                )}
                {phase === 'BATTLE_CLEAR' && !typing && (
                  <button onClick={nextBattle} className={`${btn} bg-green-600 border-green-900 hover:bg-green-700`}>
                    멘탈 +{HEAL_BETWEEN} 회복 · 다음 배틀 ({BATTLES[bi + 1].label}) ➡️
                  </button>
                )}
                {phase === 'STAGE_CLEAR' && !typing && (
                  <button onClick={nextBattle} className={`${btn} bg-gradient-to-r from-blue-600 to-indigo-600 border-blue-900 animate-bounce`}>
                    🎉 쫑쫑이가 동료로 합류했다! 스테이지 2로 ➡️
                  </button>
                )}
              </div>
            </div>
          </div>
        )}

        {phase === 'ENDING_DOC' && (
          <div className="absolute inset-0 bg-white flex items-center justify-center p-4 sm:p-8 z-50 overflow-y-auto">
            <div className="bg-[#Fdf5e6] p-6 sm:p-12 rounded-xl shadow-2xl border-8 border-[#8B4513] w-full max-w-3xl my-auto">
              <div className="text-center mb-8 sm:mb-12">
                <h2 className="text-4xl sm:text-6xl font-black text-[#5C4033] border-b-4 border-[#8B4513] inline-block pb-4 sm:pb-6 mb-8 sm:mb-10 tracking-widest">자 연 보 호 각 서</h2>
                <p className="text-[#3e2723] text-xl sm:text-3xl font-bold leading-relaxed sm:leading-loose text-left break-keep whitespace-pre-wrap">
                  우리 <span className="text-red-600">환경 파괴 인간 무리</span>는 그동안 무분별한 개발과 온실가스 배출로 북극곰의 서식지를 파괴한 것을 뼈저리게 반성합니다.
                  {"\n\n"}
                  앞으로는 <strong>친환경 에너지</strong>를 적극 사용하고, 기업의 <strong>ESG 경영</strong>을 실천하며 <strong>탄소 중립</strong>에 앞장설 것을 엄숙히 서약합니다.
                </p>
              </div>
              <div className="text-right mb-10 sm:mb-12 text-2xl sm:text-4xl font-black text-gray-800">서약자: 공장장 무리 🏭🦹‍♂️ (인)</div>
              <button onClick={() => setPhase('ENDING_FINAL')} className="w-full bg-[#8B4513] text-white font-black py-5 sm:py-6 rounded-xl text-2xl sm:text-4xl shadow-xl hover:bg-[#5C4033] transition transform hover:scale-[1.02]">
                각서 받아내기 (서명 완료)
              </button>
            </div>
          </div>
        )}

        {phase === 'ENDING_FINAL' && (
          <div className="absolute inset-0 flex flex-col items-center justify-center p-4 sm:p-8 text-center z-50 bg-gradient-to-b from-blue-200 to-green-100 overflow-y-auto">
            <div className="flex flex-col items-center w-full max-w-4xl my-auto py-10">
              <h1 className="text-4xl sm:text-6xl md:text-7xl font-black text-green-800 mb-10 sm:mb-14 drop-shadow-lg break-keep">지구가 평화를 되찾았습니다!</h1>
              <div className="mb-8 sm:mb-12 text-8xl sm:text-[10rem] animate-bounce">🌍✨🌱</div>
              <div className="flex gap-6 sm:gap-12 items-end justify-center w-full text-7xl sm:text-9xl mb-8 sm:mb-12">
                <div className="bounce-slow">🧑</div>
                <div className="bounce-slow" style={{ animationDelay: '0.5s' }}>😊🐻‍❄️</div>
              </div>
              <p className="text-2xl sm:text-4xl font-extrabold text-green-900 bg-white/90 px-8 sm:px-12 py-4 sm:py-6 rounded-full shadow-lg">모두가 함께 웃는 푸른 지구!</p>
              <p className="mt-4 text-lg sm:text-2xl font-bold text-green-800">남은 멘탈 {php}% · 6번의 배틀 모두 승리</p>
              <button onClick={() => setPhase('START')} className="mt-10 bg-green-600 text-white font-bold py-4 sm:py-6 px-10 sm:px-14 rounded-full text-xl sm:text-3xl shadow-xl hover:bg-green-700 transition transform hover:scale-110">
                처음으로 돌아가기
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
